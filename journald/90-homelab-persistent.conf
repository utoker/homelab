# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# (Storage=volatile) to spare the SD card. That wipes every log on reboot, and
# left the 2026-10-20 outage with no record of what happened. Drop-ins apply in
# filename order, so 90- wins.
#
# Logs stay on the SD card (/var/log/journal), not the SSD: if the SSD is what
# fails, the record of that failure must not depend on it.
[Journal]
Storage=persistent
SystemMaxUse=500M
# Default is 5min. A hang loses everything since the last sync, so keep it short.
SyncIntervalSec=1m
